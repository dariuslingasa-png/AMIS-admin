version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: amis-admin-app:latest
    container_name: amis_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./deploy/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
    networks:
      - amis_network

  web:
    image: nginx:alpine
    container_name: amis_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - amis_network

  horizon:
    image: amis-admin-app:latest
    container_name: amis_horizon
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - amis_network

  database:
    image: mysql:8.0
    container_name: amis_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret_root_pass
      MYSQL_DATABASE: amis_db
      MYSQL_USER: amis_user
      MYSQL_PASSWORD: secret_user_pass
    ports:
      - "33060:3306"
    volumes:
      - amis_db_data:/var/lib/mysql
    networks:
      - amis_network

  redis:
    image: redis:7-alpine
    container_name: amis_redis
    restart: unless-stopped
    ports:
      - "63790:6379"
    volumes:
      - amis_redis_data:/data
    networks:
      - amis_network

networks:
  amis_network:
    driver: bridge

volumes:
  amis_db_data:
  amis_redis_data:
